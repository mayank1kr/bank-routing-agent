[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-routing-agent"
version = "0.1.0"
description = "A Streamlit app for looking up bank routing numbers"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "streamlit",
    "pandas",
    "beautifulsoup4",
    "requests",
    "openpyxl",
    "langchain",
    "langchain-openai",
    "openai",
    "langchain-community>=0.4.0",
    "duckduckgo-search",
]

[project.scripts]
bank-routing-agent = "app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
